<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cruscotto">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone/180.png">
<link rel="icon" href="icone/192.png">
<title>Cruscotto</title>
<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --ink: #1d1e21; --muted: #6b6d73; --line: #e4e2dc;
  --accent: #2f6fdf; --ok: #2e8b57; --warn: #c2410c;
  --c1: #e07b39; --c2: #2a9d8f; --c3: #7b61c9; --c4: #9a6b47; --c5: #d0568a; --c6: #5b8def;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16171a; --card: #202226; --ink: #ecebe8; --muted: #9a9ca3; --line: #33353b;
    --accent: #6f9cf0; --ok: #5cc28a; --warn: #f08a4b;
    --c1: #f0975a; --c2: #4cc3b4; --c3: #a08ae6; --c4: #c49470; --c5: #ec7fab; --c6: #84a9f5;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
header {
  position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  padding: 12px 16px 8px; border-bottom: 1px solid var(--line);
}
.riga { display: flex; align-items: center; gap: 10px; }
h1 { font-size: 20px; margin: 0; flex: 1; letter-spacing: -0.01em; }
.fresco { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
button {
  font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 8px 14px;
  background: var(--accent); color: #fff; cursor: pointer;
}
button.secondario { background: transparent; color: var(--accent); border: 1px solid var(--line); }
button:disabled { opacity: .55; }
nav { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav a {
  flex: none; font-size: 13px; padding: 5px 11px; border-radius: 999px; text-decoration: none;
  color: var(--ink); background: var(--card); border: 1px solid var(--line);
}
main { max-width: 860px; margin: 0 auto; padding: 12px 16px 48px; }
section { margin: 18px 0 26px; scroll-margin-top: 110px; }
h2 { font-size: 16px; margin: 0 0 10px; }
.carta { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.cifre { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.cifra .n { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.cifra .l { color: var(--muted); font-size: 12.5px; }
.nota { color: var(--muted); font-size: 12.5px; margin: 8px 0 0; }
.vuoto { color: var(--muted); font-size: 14px; }
.grafico { width: 100%; height: 230px; transition: height .3s ease; }
.grafico.tre-d { height: 320px; }
.scelta { display: inline-flex; float: right; margin: -38px 0 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.scelta button { background: transparent; color: var(--muted); padding: 4px 12px; font-size: 12.5px; }
.scelta button.attivo { background: var(--accent); color: #fff; }
section { opacity: 0; transform: translateY(14px); transition: opacity .5s ease, transform .5s ease; }
section.visibile { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { section { opacity: 1; transform: none; transition: none; } }
.legenda { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.legenda i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: 0; }
.dettaglio { font-size: 13px; min-height: 1.4em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.tabella { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.lista { list-style: none; margin: 0; padding: 0; }
.lista li { padding: 9px 0; border-bottom: 1px solid var(--line); }
.lista li:last-child { border-bottom: 0; }
.lista .su { font-size: 12px; color: var(--muted); }
.etichetta { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.etichetta.alta { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.etichetta.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
a { color: var(--accent); }
.chiave { font: 11px/1.35 ui-monospace, Menlo, monospace; word-break: break-all; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; max-height: 160px; overflow: auto; }
.avviso { border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
input[type=password], input[type=text] { font: inherit; width: 100%; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
details summary { cursor: pointer; color: var(--accent); font-size: 13.5px; margin-top: 8px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="riga">
    <h1>Cruscotto</h1>
    <button id="controlla" type="button">Controlla ora</button>
  </div>
  <div class="fresco" id="fresco">Carico…</div>
  <nav id="menu" hidden>
    <a href="#guadagni">Guadagni</a><a href="#download">Download</a><a href="#app">App</a>
    <a href="#pubblicita">Pubblicità</a><a href="#ricerche">Ricerche Play</a><a href="#dafare">Da fare</a>
    <a href="#attivita">Attività</a><a href="#stampa">Stampa</a><a href="#impostazioni">Impostazioni</a>
  </nav>
</header>
<main id="main"></main>
<script src="lib/echarts.min.js"></script>
<script src="lib/echarts-gl.min.js"></script>
<script src="app.js"></script>
</body>
</html>
